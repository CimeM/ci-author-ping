name: 'ci-author-ping'
description: 'Smart CI failure router using git blame and custom rules mapping.'
inputs:
  slack_webhook_url:
    description: 'Slack Webhook URL for incoming alerts'
    required: false
  slack_bot_token:
    description: 'Slack Bot OAuth token (xoxb-...) used to DM the blamed author directly'
    required: false
  rules_file:
    description: 'Path to custom rules configuration file'
    required: false
    default: '.github/alert-config.yml'
  fallback_contact:
    description: 'Default fallback email or Slack channel'
    required: true
    default: '#pipeline-alerts'
runs:
  using: 'node20'
  main: 'dist/index.js'
