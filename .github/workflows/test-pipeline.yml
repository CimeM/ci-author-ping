name: Test AuthorPing Pipeline

on:
  workflow_dispatch: # Allows you to manually trigger this test from the GitHub Actions tab
  push:
    branches:
      - main
      - test-ci # Optional: trigger on a test branch

jobs:
  # Scenario 1: Test Docker Build Failure & Source File Blame Routing
  test-docker-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker Image
        run: |
          echo "Simulating a docker build failure..."
          echo "Error: failed to solve: process '/bin/sh -c npm run build' did not complete successfully"
          exit 1

      - name: Run AuthorPing (On Failure)
        if: failure()
        uses: ./
        with:
          fallback_contact: '#pipeline-alerts'
          rules_file: '.github/blame-rules.yml'
        env:
          FAILED_STEP_NAME: 'Build Docker Image'
          ERROR_LOGS: "Error: failed to solve: process '/bin/sh -c npm run build' did not complete successfully"

  # Scenario 2: Test Infrastructure / Network Error Regex Routing
  test-infra-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Connect to External Registry
        run: |
          echo "Attempting to pull base image..."
          echo "Temporary failure in name resolution while connecting to registry.docker.io"
          exit 1

      - name: Run AuthorPing (On Failure)
        if: failure()
        uses: ./
        with:
          fallback_contact: '#devops-escalations'
          rules_file: '.github/blame-rules.yml'
        env:
          FAILED_STEP_NAME: 'Connect to External Registry'
          ERROR_LOGS: "Temporary failure in name resolution while connecting to registry.docker.io"
